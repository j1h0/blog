<p>역시 라면엔 단무지이지요.<br>
김치는 너무 과하고 그냥 먹긴 라면에 너무 예의없다.<br>
이런 조합으로 먹을때마다,<br>
고등학교 시절 기숙사를 몰래 빠져나와 학교앞 백악관이라 불리던 라면집에서 끓여내어주던 라면과 단무지가 생각나지요.<br>
답답했던 시절에 그나마 좋은 기억을 회상할 수 있어서 더 좋은가봅니다.</p></div></article><nav class="post-nav" aria-label="이전 글과 다음 글" data-pagefind-ignore><a class="older" href="/blog/posts/2017/170523-221011909146/"><span>이전 글</span>뒤 늦은, 서천 국립생태원 방문기</a><a class="newer" href="/blog/posts/2017/170530-221017220551/"><span>다음 글</span>다시 찾은 웨스턴캠프 캠핑장</a></nav></main><footer class="site-footer"><div class="wrap footer-row"><span>심플하고 여유있는 삶</span><span class="links"><a href="/blog/rss.xml">RSS</a></span></div></footer><script>
